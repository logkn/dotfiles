[options]
focus_follows_mouse = true
mouse_follows_focus = true
animation_speed = 80
preset_column_widths = [0.5, 1.0]
# auto_center = true

[swipe.gesture]
fingers_count = 4

[padding]
top = 8
bottom = 8
left = 8
right = 8

[decorations]
# Avoid menu-bar rendering load and intermittent keyboard event-tap failures.
workspace_menu_status = false

[decorations.inactive.dim]
opacity = -0.05

[decorations.active.border]
enabled = true
color = "#c89b7b"
width = 4.0

[bindings]
# Moves the focus between windows.
window_focus_west = ["alt - h"]
window_focus_east = ["alt - l"]
window_focus_north = ["alt - k"]
window_focus_south = ["alt - j"]

# Swaps windows in chosen direction.
window_swap_west = ["alt + ctrl - h"]
window_swap_east = ["alt + ctrl - l"]
window_swap_north = ["alt + ctrl - k"]
window_swap_south = ["alt + ctrl - j"]

# Jump to the left-most or right-most windows.
window_focus_first = "alt - g"
window_focus_last = ["alt + shift - g"]

# Centers the current window on screen.
window_center = ["alt - c"]

# Cycles between preset window sizes.
window_resize = ["alt - f"]

# Toggles the window for management (floating).
window_manage = ["alt - v"]

# Stacks and unstacks a window into the left column.
window_stack = ["alt - ]"]
window_unstack = ["alt + shift - ]"]

# Quits the window manager.
quit = ["ctrl + alt - q"]

[windows]

[windows.pip]
# Title RegExp pattern is required.
title = "Picture.*(in)?.*[Pp]icture"
# Do not manage this window, e.g. it will be floating.
floating = true

[windows.popup]
# Matches a popup and silently appends it at the end.
title = "Unimportant popup window"
dont_focus = true
index = 100

[windows.all]
# Match Niri's 16-pixel gap with 8 pixels of inset on each window edge.
title = ".*"
width = 0.5
horizontal_padding = 8
vertical_padding = 8
