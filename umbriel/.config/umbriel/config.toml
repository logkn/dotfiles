# Migrated from Logan's Niri configuration, 2026-10-18.
[include.optional]
files = ["noctalia.toml"]

[general]
autostart = ["/usr/lib/pam_kwallet_init", "nm-applet", "fcitx5 -d", "env TERMINAL=ghostty noctalia", "playerctld daemon", "mpris-proxy", "dropbox"]
focus_on_activate = false

[environment]
QT_QPA_PLATFORMTHEME = "qt6ct"
TERMINAL = "ghostty"

[input.keyboard]
options = "caps:swapescape"
numlock_toggle = true
repeat_rate = 50
repeat_delay = 200

[input.touchpad]
tap = true
natural_scroll = true

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0.0

[input.cursor]
theme = "breeze_cursors"
size = 24
hide_when_typing = true
hide_timeout_ms = 1000

[output.DP-2]
mode = "2560x1440@144"
scale = 1.0
position = [440, 0]
workspace_axis = "vertical"

[output.DP-1]
mode = "3440x1440@164.900"
scale = 1.0
position = [0, 1440]
workspace_axis = "vertical"

[[workspace]]
name = "gaming"
output = "DP-2"

[layout]
mode = "scrolling"
gap = 16
extent_presets = [0.33333, 0.5, 0.66667]

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = false
center_focused = "never"

[appearance]
prefer_no_csd = true
corner_radius = 10

[appearance.blur]
passes = 3
radius = 3
noise = 0.02
saturation = 1.5

[appearance.shadow]
enabled = true
softness = 20
offset_x = 0
offset_y = 5

[colors]
shadow = "#00000088"
insert_hint = "#c89b7b80"

[colors.border]
focused = "#c89b7b"
unfocused = "#1a1a1e"

[[window_rule]]
default_focused = false
shadow = false

[[window_rule]]
match.is_focused = false
opacity = 0.65
blur = true
blur_optimized = false

[[window_rule]]
match.is_focused = true
opacity = 1.0
shadow = true

[[window_rule]]
match.app_id = "^[Ss][Tt][Ee][Aa][Mm]([Ww][Ee][Bb][Hh][Ee][Ll][Pp][Ee][Rr])?$"
default_fullscreen = true
default_focused = true
default_workspace = "gaming"
default_output = "DP-2"

# Native Steam game placement/focus replaces the Niri-specific event helper.
[[window_rule]]
match.app_id = "^steam_app_.*$"
default_focused = true
default_workspace = "gaming"
default_output = "DP-2"

[[window_rule]]
match.app_id = "firefox$"
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = "^ChatGPT$"
match.is_floating = true
opacity = 1.0
border_width = 0
shadow = false
blur = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[layer_rule]]
match.namespace = "^noctalia-(bar-.*|notification|dock|panel|attached-panel|osd|desktop-widget-.*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[keybinds]
"Mod+Shift+Slash" = { action = "cheatsheet-toggle" }
"Mod+Return" = { action = "spawn ghostty", repeat = false }
"Mod+B" = { action = "spawn zen-browser", repeat = false }
"Mod+G" = { action = "spawn /home/logan/.config/umbriel/scripts/steam-start.sh", repeat = false }
"Mod+E" = { action = "spawn nemo", repeat = false }
"Mod+R" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+M" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+Comma" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Alt+1" = { action = "spawn ddcutil --model AW3423DWF setvcp 60 0x0f", repeat = false, allow_when_inhibited = true }
"Mod+Alt+2" = { action = "spawn ddcutil --model AW3423DWF setvcp 60 0x13", repeat = false, allow_when_inhibited = true }
"Super+Alt+S" = { action = "spawn pkill orca || exec orca", repeat = false, allow_when_locked = true }
"XF86AudioRaiseVolume" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga", repeat = false, allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga", repeat = false, allow_when_locked = true }
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga", repeat = false, allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", repeat = false, allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn playerctl --player=playerctld pause", repeat = false, allow_when_locked = true }
"XF86AudioPause" = { action = "spawn playerctl --player=playerctld pause", repeat = false, allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn brightnessctl --class=backlight set +10%", repeat = false, allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl --class=backlight set 10%-", repeat = false, allow_when_locked = true }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+C" = { action = "window-close", repeat = false }
"Mod+Down" = { action = "window-focus-down" }
"Mod+Up" = { action = "window-focus-up" }
"Mod+H" = { action = "window-focus-left" }
"Mod+J" = { action = "output-focus-down" }
"Mod+K" = { action = "output-focus-up" }
"Mod+L" = { action = "window-focus-right" }
"Mod+Ctrl+H" = { action = "column-move-left" }
"Mod+Ctrl+L" = { action = "column-move-right" }
"Mod+Home" = { action = "column-focus-first" }
"Mod+End" = { action = "column-focus-last" }
"Mod+Ctrl+Home" = { action = "column-move-to-first" }
"Mod+Ctrl+End" = { action = "column-move-to-last" }
"Mod+Ctrl+J" = { action = "column-move-to-output-down" }
"Mod+Ctrl+K" = { action = "column-move-to-output-up" }
"Mod+Shift+Ctrl+Right" = { action = "column-move-to-output-right" }
"Mod+Shift+Ctrl+H" = { action = "column-move-to-output-left" }
"Mod+Shift+Ctrl+J" = { action = "column-move-to-output-down" }
"Mod+Shift+Ctrl+K" = { action = "column-move-to-output-up" }
"Mod+Shift+Ctrl+L" = { action = "column-move-to-output-right" }
"Mod+Page_Down" = { action = "workspace-next" }
"Mod+Page_Up" = { action = "workspace-previous" }
"Mod+N" = { action = "workspace-next" }
"Mod+P" = { action = "workspace-previous" }
"Mod+Ctrl+Page_Down" = { action = "column-move-to-workspace-next" }
"Mod+Ctrl+Page_Up" = { action = "column-move-to-workspace-previous" }
"Mod+Ctrl+U" = { action = "column-move-to-workspace-next" }
"Mod+Ctrl+I" = { action = "column-move-to-workspace-previous" }
"Mod+Ctrl+N" = { action = "column-move-to-workspace-next" }
"Mod+Ctrl+P" = { action = "column-move-to-workspace-previous" }
"Mod+Shift+Page_Down" = { action = "workspace-move-down" }
"Mod+Shift+Page_Up" = { action = "workspace-move-up" }
"Mod+Shift+U" = { action = "workspace-move-down" }
"Mod+Shift+I" = { action = "workspace-move-up" }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+WheelRight" = { action = "window-focus-right" }
"Mod+WheelLeft" = { action = "window-focus-left" }
"Mod+Ctrl+WheelRight" = { action = "column-move-right" }
"Mod+Ctrl+WheelLeft" = { action = "column-move-left" }
"Mod+Shift+WheelDown" = { action = "window-focus-right" }
"Mod+Shift+WheelUp" = { action = "window-focus-left" }
"Mod+Ctrl+Shift+WheelDown" = { action = "column-move-right" }
"Mod+Ctrl+Shift+WheelUp" = { action = "column-move-left" }
"Mod+1" = { action = "workspace-switch 1" }
"Mod+2" = { action = "workspace-switch 2" }
"Mod+3" = { action = "workspace-switch 3" }
"Mod+4" = { action = "workspace-switch 4" }
"Mod+5" = { action = "workspace-switch 5" }
"Mod+6" = { action = "workspace-switch 6" }
"Mod+7" = { action = "workspace-switch 7" }
"Mod+8" = { action = "workspace-switch 8" }
"Mod+9" = { action = "workspace-switch 9" }
"Mod+Ctrl+1" = { action = "column-move-to-workspace 1" }
"Mod+Ctrl+2" = { action = "column-move-to-workspace 2" }
"Mod+Ctrl+3" = { action = "column-move-to-workspace 3" }
"Mod+Ctrl+4" = { action = "column-move-to-workspace 4" }
"Mod+Ctrl+5" = { action = "column-move-to-workspace 5" }
"Mod+Ctrl+6" = { action = "column-move-to-workspace 6" }
"Mod+Ctrl+7" = { action = "column-move-to-workspace 7" }
"Mod+Ctrl+8" = { action = "column-move-to-workspace 8" }
"Mod+Ctrl+9" = { action = "column-move-to-workspace 9" }
"Mod+BracketLeft" = { action = "window-consume-or-expel-left" }
"Mod+BracketRight" = { action = "window-consume-or-expel-right" }
"Mod+Shift+R" = { action = "window-cycle-secondary-extent" }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Minus" = { action = "window-modify-primary-extent -0.1" }
"Mod+Equal" = { action = "window-modify-primary-extent 0.1" }
"Mod+Shift+Minus" = { action = "window-modify-secondary-extent -0.1" }
"Mod+Shift+Equal" = { action = "window-modify-secondary-extent 0.1" }
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+V" = { action = "window-focus-switch-floating" }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Alt+Minus" = { action = "spawn ~/.config/umbriel/scripts/type-dash.sh en", repeat = false }
"Alt+Shift+Minus" = { action = "spawn ~/.config/umbriel/scripts/type-dash.sh em", repeat = false }
"Mod+S" = { action = "spawn ~/.config/umbriel/scripts/screenshot-region.sh clipboard", repeat = false }
"Mod+Shift+S" = { action = "spawn ~/.config/umbriel/scripts/screenshot-region.sh", repeat = false }
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true }
"Mod+Shift+E" = { action = "session-quit", repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit", repeat = false }
"Mod+Shift+P" = { action = "dpms-off" }

# BEGIN focus-companion (remove this block to undo)
[[window_rule]]
match.app_id = "^local\\.focus-companion$"
default_floating = true
default_focused = false
opacity = 1.0
border_width = 0
shadow = false
blur = false
# END focus-companion
